name: Code Audit (DAST)

# Clones the target application at workflow runtime, boots it INSIDE the
# ephemeral runner, and attacks that in-runner instance with OWASP ZAP
# (baseline, then full active scan), Nuclei and Nikto.
#
# This repository hosts NO application source of its own — the app under test is
# fetched from `target_repo` @ `target_ref` into ./target at run time and is
# never committed here. See docs/adr/ADR-001.
#
# SAFETY
#   * `workflow_dispatch` only — never on push/PR. Active scans send attack
#     payloads and must never be triggered incidentally.
#   * The only scan target is http://127.0.0.1:3000 inside this runner. The
#     scanned URL is NOT an input, precisely so the workflow cannot be pointed
#     at production, shared, or third-party infrastructure. `target_repo`
#     selects which SOURCE is built — it can never redirect attack traffic.
#   * The app is booted with DUMMY Supabase credentials (see below). The real
#     backend is a hosted Supabase project — a third party — so it must never
#     receive scan traffic. With dummy values the app still serves every page;
#     only the data/auth calls fail, which is acceptable for an unauthenticated
#     DAST pass.
#   * Nuclei runs with `-ni` (interactsh disabled) so no OAST callbacks leave
#     the runner.
#
# The app under test (recon-confirmed): Next.js 15.2.4 / React 19 / TypeScript,
# pnpm lockfile v9, no Dockerfile or compose file upstream -> the Node runtime
# is set up directly on the runner rather than via a container image.
#
# Reports (HTML / JSON / JSONL / SARIF / XML, whatever each tool emits) are
# uploaded as run artifacts only. They are NOT sent to the Security tab: these
# are runtime URL findings against a repository whose source does not live
# here, so they would not map to any path in this repository.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo of the application to clone, build and scan"
        required: true
        default: "ILoveBacteria/english-vocab-memorization"
        type: string
      target_ref:
        description: "branch/tag/SHA of target_repo. Pinned by default for reproducibility."
        required: false
        default: "ed3b2bdfa8918e317a46b15766d5d0a3d30e88c9"
        type: string
      run_zap_baseline:
        description: "Run ZAP baseline (passive) scan"
        required: false
        default: true
        type: boolean
      run_zap_full:
        description: "Run ZAP full ACTIVE scan (slow, sends attack payloads)"
        required: false
        default: true
        type: boolean
      run_nuclei:
        description: "Run Nuclei"
        required: false
        default: true
        type: boolean
      run_nikto:
        description: "Run Nikto"
        required: false
        default: true
        type: boolean
      zap_spider_minutes:
        description: "Minutes ZAP may spend spidering (per scan)"
        required: false
        default: "5"
        type: string

# TODO phase 2: pin every `uses:` below to a full commit SHA instead of a tag —
# a repo evaluating supply-chain tooling should practice supply-chain hygiene.
#
# Least privilege: this workflow only clones a PUBLIC target (no token scopes
# needed; the checkout also sets `persist-credentials: false`) and uploads run
# artifacts, which use the Actions runtime token rather than GITHUB_TOKEN
# scopes — so the token gets no permissions at all.
permissions: {}

concurrency:
  group: audit-dast-${{ github.ref }}-${{ github.event.inputs.target_repo }}
  cancel-in-progress: false

env:
  APP_PORT: "3000"
  TARGET_URL: "http://127.0.0.1:3000"
  REPORT_DIR: dast-reports
  APP_DIR: target
  TARGET_REPO: ${{ github.event.inputs.target_repo }}
  TARGET_REF: ${{ github.event.inputs.target_ref }}
  # Dummy, non-routable Supabase config: lets the app build and boot without
  # touching the real hosted project. Not secrets.
  NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "dast-dummy-anon-key"
  NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  dast:
    name: DAST - ZAP / Nuclei / Nikto
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validate target input
        run: |
          if [ -z "${TARGET_REPO}" ]; then
            echo "::error::target_repo is required - this repository contains no application to boot."
            exit 1
          fi
          echo "Will build and scan ${TARGET_REPO}@${TARGET_REF:-default branch}"

      # Only the target is checked out; nothing from this repository is needed
      # at run time.
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: ${{ env.APP_DIR }}
          # Never write the job token into the UNTRUSTED target's .git/config —
          # `pnpm install` / `pnpm build` below execute lifecycle and build
          # scripts from that tree and its ~310 third-party packages.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pnpm (lockfile is pnpm v9)
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build application
        working-directory: ${{ env.APP_DIR }}
        run: pnpm build

      - name: Prepare report directory
        run: |
          mkdir -p "$REPORT_DIR"
          # ZAP's container user is not root; make the bind mount writable.
          chmod 777 "$REPORT_DIR"

      - name: Start application
        working-directory: ${{ env.APP_DIR }}
        run: |
          nohup pnpm exec next start -H 0.0.0.0 -p "$APP_PORT" \
            > "$GITHUB_WORKSPACE/app.log" 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for the application to respond
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null "$TARGET_URL"; then
              echo "App is up after ${i}s"
              curl -sS -D - -o /dev/null "$TARGET_URL"
              exit 0
            fi
            sleep 1
          done
          echo "::error::App did not respond on $TARGET_URL within 60s"
          cat "$GITHUB_WORKSPACE/app.log" || true
          exit 1

      # ------------------------------------------------------------- ZAP
      - name: ZAP baseline scan (passive)
        if: inputs.run_zap_baseline
        continue-on-error: true          # non-zero exit just means "alerts found"
        run: |
          docker run --rm --network host \
            -v "${PWD}/${REPORT_DIR}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "$TARGET_URL" \
              -m "${{ inputs.zap_spider_minutes }}" \
              -r zap-baseline.html \
              -J zap-baseline.json \
              -x zap-baseline.xml \
              -w zap-baseline.md \
              -I

      - name: ZAP full scan (ACTIVE - sends attack payloads)
        if: inputs.run_zap_full
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${PWD}/${REPORT_DIR}:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
              -t "$TARGET_URL" \
              -m "${{ inputs.zap_spider_minutes }}" \
              -r zap-full.html \
              -J zap-full.json \
              -x zap-full.xml \
              -w zap-full.md \
              -I

      # ---------------------------------------------------------- Nuclei
      - name: Nuclei scan
        if: inputs.run_nuclei
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${PWD}/${REPORT_DIR}:/reports:rw" \
            projectdiscovery/nuclei:latest \
              -target "$TARGET_URL" \
              -ni \
              -no-color \
              -stats \
              -jsonl-export /reports/nuclei.jsonl \
              -sarif-export /reports/nuclei.sarif \
              -output /reports/nuclei.txt

      # ----------------------------------------------------------- Nikto
      - name: Nikto scan (HTML report)
        if: inputs.run_nikto
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${PWD}/${REPORT_DIR}:/output:rw" \
            ghcr.io/sullo/nikto:latest \
              -h "$TARGET_URL" \
              -maxtime 15m \
              -Format htm \
              -o /output/nikto.html

      - name: Nikto scan (JSON report)
        if: inputs.run_nikto
        continue-on-error: true
        run: |
          docker run --rm --network host \
            -v "${PWD}/${REPORT_DIR}:/output:rw" \
            ghcr.io/sullo/nikto:latest \
              -h "$TARGET_URL" \
              -maxtime 15m \
              -Format json \
              -o /output/nikto.json

      # --------------------------------------------------------- wrap-up
      - name: Stop application
        if: always()
        run: |
          if [ -n "${APP_PID:-}" ]; then kill "$APP_PID" 2>/dev/null || true; fi
          pkill -f "next start" 2>/dev/null || true

      - name: Collect application log
        if: always()
        run: cp "$GITHUB_WORKSPACE/app.log" "$REPORT_DIR/app.log" || true

      # Reproducibility: record exactly which target commit, runtime and
      # scanner builds this run used. Image digests identify the precise bits
      # behind the floating `stable`/`latest` tags.
      - name: Write run manifest
        if: always()
        run: |
          {
            echo "# DAST run manifest"
            echo "workflow run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT:-1})"
            echo "date (UTC):   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "target input: ${TARGET_REPO}@${TARGET_REF:-default branch}"
            echo "target HEAD:  $(git -C "$APP_DIR" rev-parse HEAD 2>/dev/null || echo 'n/a')"
            echo "node:         $(node --version 2>/dev/null || echo 'n/a')"
            echo "pnpm:         $(pnpm --version 2>/dev/null || echo 'n/a')"
            echo ""
            echo "## scanner images (digest = the exact bits that ran)"
            for img in ghcr.io/zaproxy/zaproxy:stable projectdiscovery/nuclei:latest ghcr.io/sullo/nikto:latest; do
              digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$img" 2>/dev/null \
                || echo 'not pulled (tool disabled this run)')
              echo "$img -> $digest"
            done
            echo ""
            echo "## nuclei version"
            if docker image inspect projectdiscovery/nuclei:latest >/dev/null 2>&1; then
              docker run --rm projectdiscovery/nuclei:latest -version 2>&1 || true
            else
              echo "n/a (nuclei disabled this run)"
            fi
          } > run-manifest.txt
          cat run-manifest.txt

      - name: Upload run manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest
          path: run-manifest.txt
          if-no-files-found: warn

      # Every scan step is `continue-on-error`, so one tool dying cannot abort the
      # run. That also means a tool can fail completely while the step still
      # reports success (e.g. an image that does not exist). This step turns
      # "enabled but produced nothing" into a visible warning.
      - name: Verify each enabled tool produced a report
        if: always()
        run: |
          missing=0
          check() {   # $1 = human name, $2 = enabled?, $3 = expected file
            [ "$2" != "true" ] && return 0
            if [ ! -s "$REPORT_DIR/$3" ]; then
              echo "::warning::$1 was enabled but produced no $3 - check its step log"
              missing=$((missing+1))
            fi
          }
          check "ZAP baseline" "${{ inputs.run_zap_baseline }}" zap-baseline.json
          check "ZAP full scan" "${{ inputs.run_zap_full }}"     zap-full.json
          check "Nuclei"        "${{ inputs.run_nuclei }}"       nuclei.jsonl
          check "Nikto (HTML)"  "${{ inputs.run_nikto }}"        nikto.html
          check "Nikto (JSON)"  "${{ inputs.run_nikto }}"        nikto.json
          echo "TOOLS_MISSING_REPORTS=$missing" >> "$GITHUB_ENV"

      - name: Report summary
        if: always()
        run: |
          {
            echo "## DAST run summary"
            echo ""
            echo "Built from:  \`${TARGET_REPO}@${TARGET_REF:-default branch}\`"
            echo "Scanned URL (in-runner only): \`${TARGET_URL}\`"
            echo ""
            echo "| report | size |"
            echo "|---|---|"
            shopt -s nullglob
            for f in "$REPORT_DIR"/*; do
              echo "| $(basename "$f") | $(stat -c%s "$f") bytes |"
            done
            if [ "${TOOLS_MISSING_REPORTS:-0}" != "0" ]; then
              echo ""
              echo "**${TOOLS_MISSING_REPORTS} enabled tool(s) produced no report** - see warnings above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: ${{ env.REPORT_DIR }}/
          if-no-files-found: warn
