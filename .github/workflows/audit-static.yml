name: Code Audit (static + SCA)

# Non-interactive scanners: SAST (Semgrep, optional Snyk Code) + SCA/secrets
# (OSV-Scanner, Trivy).
#
# Two modes:
#   * SELF scan (push / pull_request / dispatch with an empty `target_repo`):
#     scans this repository's own tree. SARIF goes to Security -> Code scanning
#     AND to run artifacts.
#   * PARAMETERIZED scan (dispatch with `target_repo` set): checks out that
#     repository instead. SARIF is uploaded as run artifacts ONLY — the Security
#     tab is skipped because the file paths in the SARIF do not exist in this
#     repository and would be dropped or mis-mapped.
#
# DAST lives in audit-dast.yml (needs a running app). The AI reviewers
# (CodeRabbit / DeepSource / PR-Agent) are driven from PRs, not from here.

on:
  push:
    branches: [ main, master, "audit/**" ]
  pull_request:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "owner/repo to scan instead of this repository (empty = scan this repo, with Security-tab upload)"
        required: false
        default: ""
        type: string
      target_ref:
        description: "branch/tag/SHA of target_repo (empty = its default branch). Ignored when target_repo is empty."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  security-events: write      # required to upload SARIF to the Security tab

concurrency:
  group: audit-static-${{ github.ref }}-${{ github.event.inputs.target_repo || 'self' }}
  cancel-in-progress: false

env:
  # Empty on push/pull_request, and on a dispatch that left the input blank.
  TARGET_REPO: ${{ github.event.inputs.target_repo || '' }}
  TARGET_REF: ${{ github.event.inputs.target_ref || '' }}

jobs:
  # ---------------------------------------------------------------- SAST
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout this repository
        if: env.TARGET_REPO == ''
        uses: actions/checkout@v4

      - name: Checkout target repository
        if: env.TARGET_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}

      # Rule packs: generic security packs + the stack confirmed by recon
      # (Next.js 15 / React 19 / TypeScript app -> react, typescript,
      # javascript, nodejs). `p/nextjs` resolves in the registry but is
      # currently an EMPTY ruleset, so it is deliberately not listed.
      - name: Semgrep scan
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/default \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --config p/nodejs \
            --metrics off \
            --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF to Security tab
        if: always() && env.TARGET_REPO == ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: warn

  # ---------------------------------------------------------------- SCA
  osv-scanner:
    name: SCA - OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repository
        if: env.TARGET_REPO == ''
        uses: actions/checkout@v4

      - name: Checkout target repository
        if: env.TARGET_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}

      # Pinned to an exact release: the action has no floating `v1`/`v2` ref,
      # and its input was renamed `args` -> `scan-args` in v2. One arg per line.
      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        continue-on-error: true          # findings must not fail the trial run
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv.sarif
            ./

      - name: Upload OSV SARIF to Security tab
        if: always() && env.TARGET_REPO == ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif
          category: osv-scanner

      - name: Upload OSV SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-osv-scanner
          path: osv.sarif
          if-no-files-found: warn

  trivy:
    name: SCA + secrets - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repository
        if: env.TARGET_REPO == ''
        uses: actions/checkout@v4

      - name: Checkout target repository
        if: env.TARGET_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF to Security tab
        if: always() && env.TARGET_REPO == ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Upload Trivy SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sarif-trivy
          path: trivy.sarif
          if-no-files-found: warn

  # ------------------------------------------ optional: Snyk Code (needs token)
  # Uncomment after adding a SNYK_TOKEN repo secret (free account). Kept
  # disabled by default so the workflow runs for anyone with no account setup.
  # snyk-code:
  #   name: SAST - Snyk Code
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   steps:
  #     - name: Checkout this repository
  #       if: env.TARGET_REPO == ''
  #       uses: actions/checkout@v4
  #     - name: Checkout target repository
  #       if: env.TARGET_REPO != ''
  #       uses: actions/checkout@v4
  #       with:
  #         repository: ${{ env.TARGET_REPO }}
  #         ref: ${{ env.TARGET_REF }}
  #     - uses: snyk/actions/setup@master
  #     - name: Snyk Code test
  #       env:
  #         SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  #       run: snyk code test --sarif-file-output=snyk-code.sarif
  #       continue-on-error: true
  #     - name: Upload Snyk SARIF to Security tab
  #       if: always() && env.TARGET_REPO == ''
  #       uses: github/codeql-action/upload-sarif@v3
  #       with:
  #         sarif_file: snyk-code.sarif
  #         category: snyk-code
  #     - name: Upload Snyk SARIF as artifact
  #       if: always()
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: sarif-snyk-code
  #         path: snyk-code.sarif
  #         if-no-files-found: warn

  # ------------------------------------------------------------- aggregation
  summary:
    name: Findings summary
    runs-on: ubuntu-latest
    needs: [ semgrep, osv-scanner, trivy ]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Download all SARIF artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true

      - name: Count findings per SARIF file
        run: |
          {
            echo "## Static audit summary"
            echo ""
            echo "Scanned: \`${TARGET_REPO:-${GITHUB_REPOSITORY}}\`"
            echo ""
            echo "| SARIF file | results |"
            echo "|---|---|"
            shopt -s nullglob
            for f in sarif/*.sarif; do
              n=$(jq '[.runs[].results[]?] | length' "$f" 2>/dev/null || echo "parse error")
              echo "| $(basename "$f") | ${n} |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-upload combined SARIF bundle
        uses: actions/upload-artifact@v4
        with:
          name: sarif-all
          path: sarif/
          if-no-files-found: warn
